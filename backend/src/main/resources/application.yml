spring:
  application:
    name: cookingapp-backend

server:
  port: 8080

# AWS Configuration
aws:
  region: ${AWS_REGION:ap-northeast-1}

  # DynamoDB Configuration
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    table:
      users: ${AWS_DYNAMODB_TABLE_USERS:Users}
      recipes: ${AWS_DYNAMODB_TABLE_RECIPES:Recipes}

  # Cognito Configuration
  cognito:
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    region: ${AWS_COGNITO_REGION:ap-northeast-1}

  # S3 Configuration
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:cookingapp-storage}
    region: ${AWS_S3_REGION:ap-northeast-1}

# Logging Configuration
logging:
  level:
    root: INFO
    com.cookingapp: DEBUG
    software.amazon.awssdk: WARN
