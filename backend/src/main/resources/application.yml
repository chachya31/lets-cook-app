spring:
  application:
    name: cooking-support-app
  messages:
    basename: messages/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

aws:
  region: ap-northeast-1
  endpoint: ${AWS_ENDPOINT:}
  accessKeyId: ${AWS_ACCESS_KEY_ID:test}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:test}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    table:
      users: ${AWS_DYNAMODB_TABLE_USERS:Users}
      recipes: ${AWS_DYNAMODB_TABLE_RECIPES:Recipes}
  s3:
    bucket: ${AWS_S3_BUCKET:cooking-app-images}
  cognito:
    userPoolId: ${AWS_COGNITO_USER_POOL_ID:}
    clientId: ${AWS_COGNITO_CLIENT_ID:}
    clientSecret: ${AWS_COGNITO_CLIENT_SECRET:}

server:
  port: 8080
