spring:
  application:
    name: cookingapp-backend

server:
  port: 8080

# AWS Configuration
aws:
  region: ${AWS_REGION:ap-northeast-1}

  # DynamoDB Configuration
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    table:
      users: ${DYNAMODB_USERS_TABLE}
      recipes: ${DYNAMODB_RECIPES_TABLE}
      recipe-ingredients: ${DYNAMODB_RECIPE_INGREDIENTS_TABLE}
      schedules: ${DYNAMODB_SCHEDULES_TABLE}
      shoppingLists: ${DYNAMODB_SHOPPING_LISTS_TABLE}
      reviews: ${DYNAMODB_REVIEWS_TABLE}
      chatConversations: ${DYNAMODB_CHAT_CONVERSATIONS_TABLE}
      chatMessages: ${DYNAMODB_CHAT_MESSAGES_TABLE}
      inventory: ${DYNAMODB_INVENTORY_TABLE}

  # Cognito Configuration
  cognito:
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    region: ${AWS_COGNITO_REGION:ap-northeast-1}

  # S3 Configuration
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:cookingapp-storage}
    region: ${AWS_S3_REGION:ap-northeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION:60}

# Logging Configuration
logging:
  level:
    root: INFO
    com.cookingapp: DEBUG
    software.amazon.awssdk: WARN
