[project]
name = "cooking-support-app"
version = "1.0.0"
description = "Cooking Support App - Python Backend"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # AWS SDK
    "boto3>=1.35.0",

    # Settings & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Authentication (JWT)
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",

    # Logging
    "python-json-logger>=3.2.0",

    # Lambda Adapter
    "mangum>=0.19.0",

    # Google Generative AI
    "google-generativeai>=0.8.0",

    # ULID
    "python-ulid>=3.0.0",

    # File Upload
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "moto[dynamodb,s3,cognitoidp]>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "boto3-stubs[dynamodb,s3,cognito-idp]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
