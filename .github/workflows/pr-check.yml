name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check PR title
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?: ]]; then
          echo "❌ PR title must follow conventional commits format"
          echo "Examples: feat: add user login, fix(api): resolve timeout issue"
          exit 1
        fi
        echo "✅ PR title format is valid"
        
    - name: Check for large files
      run: |
        LARGE_FILES=$(find . -type f -size +5M -not -path "*/node_modules/*" -not -path "*/.git/*")
        if [ -n "$LARGE_FILES" ]; then
          echo "❌ Large files detected (>5MB):"
          echo "$LARGE_FILES"
          exit 1
        fi
        echo "✅ No large files detected"
        
    - name: Check for merge conflicts
      run: |
        if grep -r "<<<<<<< HEAD" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Merge conflict markers found"
          exit 1
        fi
        echo "✅ No merge conflicts"
        
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [pr-validation]
    
    steps:
    - name: Success
      run: echo "✅ All PR checks passed!"
